[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listbuildv2"
version = "0.1.0"
description = "API-first provider clients for list building workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.scripts]
listbuild = "listbuild.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
